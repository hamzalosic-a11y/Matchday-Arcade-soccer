<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matchday+ Boost Edition</title>
  <style>
    :root {
      --bg: #081827;
      --panel: rgba(11, 23, 36, 0.8);
      --panel-bright: rgba(22, 41, 62, 0.96);
      --line: rgba(255,255,255,0.12);
      --text: #eef6ff;
      --muted: #b9d0ea;
      --gold: #ffd166;
      --green: #69d48d;
      --danger: #ff6b6b;
      --sky: #7ac8ff;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #0f1d34 0%, var(--bg) 45%, #050d17 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      user-select: none;
    }

    #app {
      position: relative;
      width: min(100vw, 1200px);
      height: min(100vh, 760px);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(18,35,52,.72), rgba(8,19,31,.88));
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
      overflow: hidden;
      border-radius: 18px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, rgba(15,72,40,.9), rgba(17,94,56,.95));
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #scoreboard {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 18px;
      border-radius: 16px;
      background: rgba(8, 19, 29, 0.7);
      border: 1px solid var(--line);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 26px rgba(0,0,0,.25);
    }

    .team-tag {
      font-size: 1rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 92px;
      text-align: center;
      font-weight: 700;
    }

    .score {
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--text);
      min-width: 120px;
      text-align: center;
    }

    #timer {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(255,255,255,.04);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,209,102,.35);
    }

    #power {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(32vw, 340px);
      height: 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: inset 0 3px 10px rgba(0,0,0,.18);
    }

    #power-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green), var(--gold), var(--danger));
      transition: width .08s linear;
    }

    #status {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 4px 18px rgba(0,0,0,.5);
      opacity: 0;
      transition: opacity .25s ease;
    }

    #status.show {
      opacity: 1;
    }

    .panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(3,10,18,.38);
      backdrop-filter: blur(4px);
      z-index: 10;
    }

    .panel.hidden {
      display: none;
    }

    .menu {
      width: min(88vw, 540px);
      padding: 28px 28px 22px;
      border-radius: 22px;
      background: rgba(9, 17, 25, 0.78);
      border: 1px solid var(--line);
      box-shadow: 0 30px 70px rgba(0,0,0,.45);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.1rem, 7vw, 6rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 .plus {
      color: var(--gold);
    }

    .sub {
      margin: 10px 0 24px;
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      pointer-events: auto;
      appearance: none;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, #1b2d45, #122236);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      box-shadow: 0 12px 20px rgba(0,0,0,.18);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 26px rgba(0,0,0,.22);
    }

    button.primary {
      background: linear-gradient(180deg, #f7d66c, #deb549);
      color: #172131;
      border-color: rgba(255,255,255,.22);
    }

    button.secondary {
      background: linear-gradient(180deg, #173b4d, #0e2c3d);
    }

    .meta {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .meta span {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 999px;
      padding: 8px 10px;
    }

    @media (max-width: 620px) {
      #app {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      #scoreboard {
        padding: 8px 10px;
        gap: 8px;
      }

      .team-tag {
        min-width: 60px;
        font-size: .7rem;
      }

      #timer {
        font-size: .62rem;
      }

      #power {
        width: min(44vw, 220px);
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="scoreboard">
        <div class="team-tag" id="homeTag">Blue</div>
        <div class="score" id="score">0 - 0</div>
        <div class="team-tag" id="awayTag">Gold</div>
        <div id="timer">90'</div>
      </div>
      <div id="status">Boost online</div>
      <div id="power"><div id="power-fill"></div></div>
    </div>

    <div class="panel" id="menuPanel">
      <div class="menu">
        <h1>Matchday<span class="plus">+</span></h1>
        <div class="sub">Boost edition</div>
        <div class="cta-row">
          <button id="startBtn" class="primary">Kick off</button>
          <button id="boostBtn" class="secondary">Toggle boost</button>
        </div>
        <div class="meta">
          <span>WASD Move</span>
          <span>J Pass</span>
          <span>K Shot</span>
          <span>Space Sprint</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const menuPanel = document.getElementById('menuPanel');
      const scoreEl = document.getElementById('score');
      const timerEl = document.getElementById('timer');
      const powerFill = document.getElementById('power-fill');
      const statusEl = document.getElementById('status');
      const homeTag = document.getElementById('homeTag');
      const awayTag = document.getElementById('awayTag');

      const FIELD = { width: 960, height: 540, goalWidth: 130, goalHeight: 170 };
      const keys = {};
      const aim = { x: 0, y: 0 };
      let state = 'menu';
      let boostMode = true;
      let matchTime = 90;
      let score = [0, 0];
      let cameraShake = 0;
      let weather = 'sunset';
      let worldTime = 0;
      let players = [];
      let ball = null;
      let human = null;
      let lastTime = 0;

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = rect.width * ratio;
        canvas.height = rect.height * ratio;
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function setStatus(text, show = true) {
        statusEl.textContent = text;
        statusEl.classList.toggle('show', show);
      }

      function setBoostTheme(mode) {
        weather = mode;
        const root = document.documentElement;
        if (mode === 'night') {
          root.style.setProperty('--bg', '#091427');
          root.style.setProperty('--panel', 'rgba(8, 14, 24, 0.82)');
          root.style.setProperty('--sky', '#8dc8ff');
          document.body.style.background = 'radial-gradient(circle at top, #10233f 0%, #050d17 55%, #030a12 100%)';
        } else if (mode === 'rain') {
          root.style.setProperty('--bg', '#0b1830');
          root.style.setProperty('--panel', 'rgba(12, 22, 35, 0.84)');
          root.style.setProperty('--sky', '#7ab9f9');
          document.body.style.background = 'radial-gradient(circle at top, #1b2d47 0%, #0a1422 55%, #050a12 100%)';
        } else if (mode === 'sunset') {
          root.style.setProperty('--bg', '#081827');
          root.style.setProperty('--panel', 'rgba(11, 23, 36, 0.8)');
          root.style.setProperty('--sky', '#7ac8ff');
          document.body.style.background = 'radial-gradient(circle at top, #0f1d34 0%, #081827 45%, #050d17 100%)';
        }
      }

      function createPlayer(team, x, y, number, color) {
        return {
          team,
          x,
          y,
          vx: 0,
          vy: 0,
          radius: 18,
          number,
          color,
          stamina: 100,
          style: team === 0 ? 'blue' : 'gold',
          role: team === 0 ? 'attack' : 'defend'
        };
      }

      function resetMatch() {
        players = [];
        const home = ['#5387ff', '#6fa9ff', '#7dd3fc', '#c7d7ff', '#a8bef5', '#6cc7ff'];
        const away = ['#ffd166', '#ffb703', '#ffc94d', '#ffe29a', '#ffd8a8', '#f4d35e'];

        for (let i = 0; i < 6; i++) {
          const x = 150 + i * 60;
          const y = 150 + (i % 3) * 110 + (i >= 3 ? 25 : 0);
          players.push(createPlayer(0, x, y, i + 1, home[i]));
        }

        for (let i = 0; i < 6; i++) {
          const x = FIELD.width - 150 - i * 60;
          const y = 150 + (i % 3) * 110 + (i >= 3 ? 25 : 0);
          players.push(createPlayer(1, x, y, i + 1, away[i]));
        }

        human = players[0];
        ball = { x: FIELD.width / 2, y: FIELD.height / 2, vx: 0, vy: 0, radius: 10, owner: null };
        score = [0, 0];
        matchTime = 90;
        scoreEl.textContent = `${score[0]} - ${score[1]}`;
        timerEl.textContent = `${Math.max(0, Math.ceil(matchTime))}'`;
        powerFill.style.width = '0%';
        setStatus('Boost online');
      }

      function startGame() {
        resetMatch();
        state = 'playing';
        menuPanel.classList.add('hidden');
      }

      function toggleBoost() {
        boostMode = !boostMode;
        const nextMode = boostMode ? 'sunset' : 'night';
        setBoostTheme(nextMode);
        setStatus(boostMode ? 'Boost online' : 'Classic mode');
      }

      function moveHuman(dt) {
        if (!human || state !== 'playing') return;

        const speed = 220 * (keys[' '] ? 1.35 : 1);
        let dx = 0;
        let dy = 0;
        if (keys.w || keys.ArrowUp) dy -= 1;
        if (keys.s || keys.ArrowDown) dy += 1;
        if (keys.a || keys.ArrowLeft) dx -= 1;
        if (keys.d || keys.ArrowRight) dx += 1;

        if (dx || dy) {
          const len = Math.hypot(dx, dy) || 1;
          human.x += (dx / len) * speed * dt;
          human.y += (dy / len) * speed * dt;
        }

        human.x = clamp(human.x, 35, FIELD.width - 35);
        human.y = clamp(human.y, 35, FIELD.height - 35);

        const target = ball.owner !== null && ball.owner.team === 0 ? ball : null;
        if (target) {
          const distToBall = distance(human, ball);
          if (distToBall < 25) {
            ball.owner = human;
          }
        }
      }

      function shootBall(player, powerBoost = 1) {
        if (!ball || ball.owner !== player) return;
        const targetX = player.team === 0 ? FIELD.width + 10 : -10;
        const targetY = FIELD.height / 2 + rand(-80, 80);
        const dx = targetX - player.x;
        const dy = targetY - player.y;
        const mag = Math.hypot(dx, dy) || 1;
        ball.owner = null;
        ball.vx = (dx / mag) * 520 * powerBoost;
        ball.vy = (dy / mag) * 520 * powerBoost * 0.3;
        ball.x = player.x + (dx / mag) * 18;
        ball.y = player.y + (dy / mag) * 18;
        cameraShake = 18;
        setStatus(player.team === 0 ? 'Blue attack!' : 'Counter!');
      }

      function passBall(player) {
        if (!ball || ball.owner !== player) return;
        const receiver = players.find(p => p.team === player.team && p !== player && distance(p, player) < 180);
        if (!receiver) return;
        const dx = receiver.x - player.x;
        const dy = receiver.y - player.y;
        const mag = Math.hypot(dx, dy) || 1;
        ball.owner = null;
        ball.vx = (dx / mag) * 430;
        ball.vy = (dy / mag) * 430 * 0.7;
        ball.x = player.x + (dx / mag) * 16;
        ball.y = player.y + (dy / mag) * 16;
        cameraShake = 8;
      }

      function controlEvents() {
        document.addEventListener('keydown', (event) => {
          const key = event.key.toLowerCase();
          keys[event.key] = true;
          keys[key] = true;

          if (key === 'j' && human && human === ball.owner) passBall(human);
          if (key === 'k' && human && human === ball.owner) shootBall(human, 1.2);
          if (key === 'p' && state === 'playing') {
            state = 'paused';
            menuPanel.classList.remove('hidden');
            menuPanel.querySelector('.menu').innerHTML = `
              <h1>Paused</h1>
              <div class="sub">Matchday+ boost</div>
              <div class="cta-row">
                <button id="resumeBtn" class="primary">Resume</button>
              </div>
            `;
            document.getElementById('resumeBtn').addEventListener('click', () => {
              state = 'playing';
              menuPanel.classList.add('hidden');
            });
          }
        });

        document.addEventListener('keyup', (event) => {
          const key = event.key.toLowerCase();
          keys[event.key] = false;
          keys[key] = false;
        });

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('boostBtn').addEventListener('click', toggleBoost);
      }

      function updateAI(dt) {
        for (const player of players) {
          if (player === human) continue;

          const closest = player.team === 0 ? ball : null;
          let targetX = player.team === 0 ? FIELD.width * 0.55 : FIELD.width * 0.45;
          let targetY = FIELD.height / 2;

          if (ball.owner && ball.owner !== player) {
            if (ball.owner.team !== player.team) {
              targetX = ball.x;
              targetY = ball.y;
            } else {
              targetX = FIELD.width * (player.team === 0 ? 0.75 : 0.25);
              targetY = ball.y;
            }
          }

          if (player.team === 0) {
            if (player.x < FIELD.width * 0.82 && ball.owner === null) {
              targetX = FIELD.width * 0.6;
              targetY = FIELD.height / 2 + Math.sin(worldTime + player.number) * 110;
            }
          }

          if (player.team === 1) {
            if (ball.owner === null) {
              targetX = FIELD.width * 0.4;
              targetY = FIELD.height / 2 + Math.sin(worldTime + player.number) * 80;
            }
          }

          const dx = targetX - player.x;
          const dy = targetY - player.y;
          const mag = Math.hypot(dx, dy) || 1;
          const maxSpeed = 130 + (boostMode ? 18 : 0);
          const tx = dx / mag;
          const ty = dy / mag;
          player.x += tx * maxSpeed * dt;
          player.y += ty * maxSpeed * dt;

          if (ball.owner === player) {
            const goalX = player.team === 0 ? FIELD.width - 8 : 8;
            const goalY = FIELD.height / 2 + rand(-50, 50);
            if (Math.random() < 0.012) {
              shootBall(player, player.team === 0 ? 1.3 : 1.1);
            } else if (Math.random() < 0.008) {
              passBall(player);
            }
            player.x += ((goalX - player.x) * 0.04);
            player.y += ((goalY - player.y) * 0.04);
          }

          if (Math.abs(ball.x - player.x) < player.radius + ball.radius + 8 &&
              Math.abs(ball.y - player.y) < player.radius + ball.radius + 8 &&
              ball.owner === null) {
            ball.owner = player;
          }
        }
      }

      function updateBall(dt) {
        if (!ball) return;

        if (ball.owner) {
          const owner = ball.owner;
          ball.x = owner.x + 18;
          ball.y = owner.y;
          ball.vx *= 0.86;
          ball.vy *= 0.86;
        } else {
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;
          ball.vx *= 0.99;
          ball.vy *= 0.99;
        }

        if (ball.y < 10 || ball.y > FIELD.height - 10) {
          ball.vy *= -0.9;
          ball.y = clamp(ball.y, 10, FIELD.height - 10);
        }

        if (ball.x < 10) {
          if (ball.y > (FIELD.height - FIELD.goalHeight) / 2 && ball.y < (FIELD.height + FIELD.goalHeight) / 2) {
            score[1]++;
            cameraShake = 24;
            setStatus('Goal for Gold!');
            resetMatch();
            return;
          }
          ball.vx *= -0.8;
          ball.x = 10;
        }

        if (ball.x > FIELD.width - 10) {
          if (ball.y > (FIELD.height - FIELD.goalHeight) / 2 && ball.y < (FIELD.height + FIELD.goalHeight) / 2) {
            score[0]++;
            cameraShake = 24;
            setStatus('Goal for Blue!');
            resetMatch();
            return;
          }
          ball.vx *= -0.8;
          ball.x = FIELD.width - 10;
        }

        scoreEl.textContent = `${score[0]} - ${score[1]}`;
      }

      function renderField() {
        const width = canvas.clientWidth || FIELD.width;
        const height = canvas.clientHeight || FIELD.height;
        ctx.clearRect(0, 0, width, height);

        const shakeX = cameraShake > 0 ? rand(-cameraShake, cameraShake) : 0;
        const shakeY = cameraShake > 0 ? rand(-cameraShake, cameraShake) : 0;
        ctx.save();
        ctx.translate(shakeX, shakeY);

        ctx.fillStyle = weather === 'night' ? '#0c4c2b' : '#11743f';
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = '#eafcff';
        ctx.lineWidth = 4;
        ctx.strokeRect(38, 24, width - 76, height - 48);

        ctx.beginPath();
        ctx.moveTo(width / 2, 24);
        ctx.lineTo(width / 2, height - 24);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(width / 2, height / 2, 72, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeRect(38, (height - FIELD.goalHeight) / 2, 26, FIELD.goalHeight);
        ctx.strokeRect(width - 64, (height - FIELD.goalHeight) / 2, 26, FIELD.goalHeight);

        for (let i = 0; i < 18; i++) {
          const y = 30 + i * 32;
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.fillRect(width / 2 - 2, y, 4, 18);
        }

        if (weather === 'rain') {
          ctx.strokeStyle = 'rgba(255,255,255,0.48)';
          ctx.lineWidth = 1;
          for (let i = 0; i < 40; i++) {
            const x = (i * 41 + (worldTime * 180) % 350) % width;
            const y = (i * 31 + (worldTime * 320) % height) % height;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 8, y + 18);
            ctx.stroke();
          }
        }

        for (const player of players) {
          ctx.beginPath();
          ctx.fillStyle = player.color;
          ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(0,0,0,.35)';
          ctx.fillRect(player.x - 8, player.y - 24, 16, 6);

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(String(player.number), player.x, player.y + 4);
        }

        if (ball) {
          ctx.beginPath();
          ctx.fillStyle = '#f9f7ef';
          ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function updateHud() {
        const fill = clamp((90 - matchTime) / 90 * 100, 0, 100);
        powerFill.style.width = `${boostMode ? 100 : 40}%`;
        timerEl.textContent = `${Math.max(0, Math.ceil(matchTime))}'`;
        homeTag.textContent = 'Blue';
        awayTag.textContent = 'Gold';
      }

      function tick(ts) {
        const dt = Math.min((ts - lastTime) / 1000 || 0.016, 0.033);
        lastTime = ts;
        worldTime += dt;

        if (state === 'playing') {
          matchTime -= dt;
          if (matchTime <= 0) {
            matchTime = 0;
            state = 'menu';
            menuPanel.classList.remove('hidden');
            menuPanel.querySelector('.menu').innerHTML = `
              <h1>Full time</h1>
              <div class="sub">${score[0]} - ${score[1]}</div>
              <div class="cta-row">
                <button id="restartBtn" class="primary">Play again</button>
              </div>
            `;
            document.getElementById('restartBtn').addEventListener('click', () => {
              startGame();
            });
          }

          moveHuman(dt);
          updateAI(dt);
          updateBall(dt);
          if (cameraShake > 0) cameraShake *= 0.8;
        }

        updateHud();
        renderField();
        requestAnimationFrame(tick);
      }

      function init() {
        resizeCanvas();
        setBoostTheme('sunset');
        resetMatch();
        controlEvents();
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resizeCanvas);
      init();
    })();
  </script>
</body>
</html>
